name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          # Full clone needed for version pinning (baseline requires git history)
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install dependencies via vcpkg
        run: |
          # Use manifest mode - vcpkg.json pins Lua to 5.4.x (5.5 not supported by sol2)
          cd app && ../vcpkg/vcpkg install --triplet=x64-osx

      - name: Configure CMake
        run: |
          cmake -B build-macos \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-osx \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            app

      - name: Build
        run: cmake --build build-macos --config ${{ inputs.build_type }} --parallel

      - name: Package
        run: |
          mkdir -p dist/NexRx.app/Contents/MacOS
          mkdir -p dist/NexRx.app/Contents/Resources

          # Copy executable
          cp build-macos/nexrx_app dist/NexRx.app/Contents/MacOS/NexRx

          # Copy config and lua files to Resources
          cp -r app/config dist/NexRx.app/Contents/Resources/
          cp -r app/lua dist/NexRx.app/Contents/Resources/

          # Override twin ports for QEMU testing (7000/7001 instead of 5000/5001)
          sed -i '' 's/twinControlPort = 5000/twinControlPort = 7000/' dist/NexRx.app/Contents/Resources/config/base/defaults.lua
          sed -i '' 's/twinStreamPort = 5001/twinStreamPort = 7001/' dist/NexRx.app/Contents/Resources/config/base/defaults.lua

          # Create Info.plist
          cat > dist/NexRx.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>NexRx</string>
              <key>CFBundleIdentifier</key>
              <string>com.nexrx.app</string>
              <key>CFBundleName</key>
              <string>NexRx</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # Create zip archive
          cd dist
          zip -r ../NexRx-macos-${{ inputs.build_type }}.zip NexRx.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexRx-macos-${{ inputs.build_type }}
          path: NexRx-macos-${{ inputs.build_type }}.zip
          retention-days: 30
