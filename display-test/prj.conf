CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

CONFIG_SPI=y

CONFIG_DMA=y
CONFIG_SPI_STM32_DMA=y
CONFIG_SPI_ASYNC=y

CONFIG_CACHE_MANAGEMENT=y
CONFIG_DCACHE=y

CONFIG_APP_DISPLAY_UC1609=y

# Enable Character Framebuffer for easy bitmap/text drawing
CONFIG_CHARACTER_FRAMEBUFFER=y

# Heap
CONFIG_HEAP_MEM_POOL_SIZE=4096

# USB Console Settings
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
#CONFIG_LOG_PRINTK=n
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4

CONFIG_LOG_BACKEND_UART=y

#CONFIG_UC1609_LOG_LEVEL_DBG=y

# PICOLIBC so I can do date/time stuff
CONFIG_PICOLIBC=y

# Shell to play with OLED
CONFIG_SHELL=y
CONFIG_CHARACTER_FRAMEBUFFER_SHELL=y
