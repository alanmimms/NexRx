# NexRx Project Configuration (Zephyr v4.1 / STM32H743VIT6)

# General C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y

# Power Management & Boot
CONFIG_REBOOT=y

# Peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NET_BUF=y
CONFIG_USB_DEVICE_STACK_NEXT=y

# Display Support
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y

# Logging & Debug
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y

# CBOR Support
CONFIG_ZCBOR=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_SHELL_PROMPT_UART="NexRx> "
